---
- name: Install Python on Developer and Production Servers
  hosts: dev:prod
  become: yes

  tasks:
    - name: Ensure Python 3 is installed
      apt:
        name: python3
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Verify installed Python version
      command: python3 --version
      register: python_version_output
      changed_when: false

    - name: Print Python version
      debug:
        msg: "{{ inventory_hostname }} has {{ python_version_output.stdout }}"
